sonar.projectKey=llama-express-frontend
sonar.projectName=Llama Express Frontend
sonar.sources=src
sonar.tests=src
sonar.exclusions=src/test/**,**/*.test.ts,**/*.test.tsx
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Tidak bisa diuji unit, bukan kode bisnis:
#  - main.tsx  : titik masuk aplikasi (createRoot), hanya berjalan di browser
#  - env.ts    : membaca import.meta.env milik Vite; di Jest sengaja diganti stub lewat moduleNameMapper
sonar.coverage.exclusions=src/main.tsx,src/config/env.ts