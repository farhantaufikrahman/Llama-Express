# Di-include di setiap location yang punya add_header.
# ⚠ Jebakan Nginx: add_header di dalam location MENGHAPUS semua add_header yang diwarisi dari server{}.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=()" always;

# Mulai dengan Report-Only: pelanggaran hanya dicatat di Console browser, tidak memblokir.
# Setelah semua alur (peta, geocoding, Snap, upload foto) dicoba tanpa pelanggaran → ganti nama header
# menjadi "Content-Security-Policy" agar benar-benar ditegakkan.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://*.midtrans.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://res.cloudinary.com https://*.midtrans.com; connect-src 'self' ws://$http_host wss://$http_host https://nominatim.openstreetmap.org https://*.midtrans.com; frame-src https://*.midtrans.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;