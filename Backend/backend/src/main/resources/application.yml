app:
  midtrans:
    provider: midtrans                       # "fake" untuk test
    server-key: ${MIDTRANS_SERVER_KEY:}
    client-key: ${MIDTRANS_CLIENT_KEY:}
    snap-base-url: https://app.sandbox.midtrans.com   # production: https://app.midtrans.com
    api-base-url: https://api.sandbox.midtrans.com    # production: https://api.midtrans.com
    expiry-minutes: 15
    notification-url: ${MIDTRANS_NOTIFICATION_URL:}
  cors:
    allowed-origins:
      - http://localhost:5173 
  storage:
    provider: cloudinary           # "fake" = tidak benar-benar upload (test / dev tanpa akun)
    cloudinary-url: ${CLOUDINARY_URL:}
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
    phone: ${ADMIN_PHONE:080000000000}
  outbox:
    enabled: true
    poll-interval-ms: 1000
  
  dispatch:
    enabled: true
    radius-km: 5
    candidates-per-round: 3
    offer-ttl-seconds: 30
    max-attempts: 10
    sweep-interval-ms: 5000
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: llama-express
      access-token-ttl: 15m
      refresh-token-ttl: 7d

  order:
    road-factor: 1.3          # jarak garis lurus × 1.3 ≈ jarak jalan (estimasi)
    max-distance-km: 50
    avg-speed-kmh:
      MOTOR: 25
      CAR: 20
    max-weight-kg:
      MOTOR: 20
      CAR: 200

spring:
  application:
    name: llama-express
  config:
    import: optional:file:.env[.properties]   # baca backend/.env

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # skema DIKELOLA Flyway, Hibernate hanya memvalidasi
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
        max.block.ms: 5000
    consumer:
      group-id: llama-express
      auto-offset-reset: earliest

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always        # hanya untuk lokal

springdoc:
  swagger-ui:
    path: /swagger-ui.html