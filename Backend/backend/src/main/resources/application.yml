app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      issuer: llama-express
      access-token-ttl: 15m
      refresh-token-ttl: 7d

  order:
    road-factor: 1.3          # jarak garis lurus × 1.3 ≈ jarak jalan (estimasi)
    max-distance-km: 50
    avg-speed-kmh:
      MOTOR: 25
      CAR: 20
    max-weight-kg:
      MOTOR: 20
      CAR: 200

spring:
  application:
    name: llama-express
  config:
    import: optional:file:.env[.properties]   # baca backend/.env

  datasource:
    url: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # skema DIKELOLA Flyway, Hibernate hanya memvalidasi
    properties:
      hibernate:
        jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: llama-express
      auto-offset-reset: earliest

  data:
    redis:
      host: localhost
      port: 6379
      repositories:
        enabled: false

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always        # hanya untuk lokal

springdoc:
  swagger-ui:
    path: /swagger-ui.html