apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Image dari DockerHub (dibangun & di-push Jenkins dari main).
# ":main" = versi main terbaru → "kubectl apply -k" tidak lagi menurunkan versi ke build lokal.
# Jenkins (stage Deploy) tetap mengganti ke tag SHA yang immutable setiap rilis.
images:
  - name: llama-express/backend
    newName: farhanrahman27/llama-express-backend
    newTag: main
  - name: llama-express/frontend
    newName: farhanrahman27/llama-express-frontend
    newTag: main
secretGenerator:
  - name: oracle-credentials
    namespace: llama
    envs:
      - secrets/oracle.env
  - name: backend-secrets
    namespace: llama
    envs:
      - secrets/backend.env
  - name: cloudflared-token
    namespace: llama
    files:
      - token=secrets/cloudflared.token # key "token" → file /etc/cloudflared/token
