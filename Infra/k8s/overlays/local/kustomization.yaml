apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

# Image hasil build lokal (docker compose build). Di Jenkins nanti: newName = repo DockerHub, newTag = commit SHA.
images:
  - name: llama-express/backend
    newName: llama-express-backend
    newTag: local
  - name: llama-express/frontend
    newName: llama-express-frontend
    newTag: local
secretGenerator:
  - name: oracle-credentials
    namespace: llama
    envs:
      - secrets/oracle.env
  - name: backend-secrets
    namespace: llama
    envs:
      - secrets/backend.env
