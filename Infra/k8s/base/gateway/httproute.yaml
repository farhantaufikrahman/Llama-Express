apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: llama
spec:
  parentRefs:
    - name: llama-gateway
  rules:
    # Prefix terpanjang menang: /api dan /ws ditangani lebih dulu daripada "/"
    - matches:
        - path:
            type: PathPrefix
            value: /api
      backendRefs:
        - name: backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /ws # STOMP over WebSocket (header Upgrade diteruskan otomatis oleh NGF)
      backendRefs:
        - name: backend
          port: 8080
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: frontend
          port: 8080
