apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: llama # semua resource di bawah otomatis masuk namespace ini

labels:
  - pairs:
      app.kubernetes.io/part-of: llama-express
    includeSelectors: false # label informatif saja; jangan ubah selector (selector bersifat immutable)

resources:
  - namespace.yaml
  - redis
