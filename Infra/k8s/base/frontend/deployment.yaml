apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  # Stateless (hanya file statis) → aman lebih dari satu replika; 2 = tetap melayani saat satu pod diganti
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101 # user "nginx" di image nginx-unprivileged
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: llama-express/frontend # tag ditentukan overlay
          imagePullPolicy: IfNotPresent
          env:
            # Dipakai blok proxy /api & /ws di Nginx frontend (cadangan; Gateway sudah merutekan langsung ke backend).
            # Nginx me-resolve host ini saat start → Service "backend" harus ada (sudah, dari K3).
            - name: BACKEND_URL
              value: http://backend:8080
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # pid file & temp buffer Nginx (image unprivileged menaruhnya di /tmp)
            - name: conf
              mountPath: /etc/nginx/conf.d # envsubst menulis default.conf di sini saat container start
      volumes:
        - name: tmp
          emptyDir: {}
        - name: conf
          emptyDir: {}
