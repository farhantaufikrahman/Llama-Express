# Pod data plane Gateway (Nginx milik NGF) boleh menerima traffic dari mana saja di port HTTP —
# ia memang pintu masuk publik (localhost via LoadBalancer & cloudflared dari dalam cluster).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-public
spec:
  podSelector:
    matchLabels:
      gateway.networking.k8s.io/gateway-name: llama-gateway # nama Gateway, BUKAN nama pod
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
