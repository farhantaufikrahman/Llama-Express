apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  # 2 replika: realtime sudah aman multi-pod —
  # - TrackingWebSocketBridge memakai consumer group Kafka UNIK per pod → setiap pod menerima semua event
  #   status/lokasi lalu meneruskannya ke klien WebSocket miliknya (fan-out)
  # - job terjadwal (outbox, dispatch sweeper, housekeeping) dikunci ShedLock → hanya satu pod yang menjalankan
  # - rate limiter di Redis → batas dihitung bersama
  # - frontend me-resync data setelah reconnect (event selama terputus tidak dikirim ulang)
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # RAM node terbatas → ganti pod SATU PER SATU tanpa pod ekstra (tidak pernah ada pod ke-3).
      # Selama rollout 1 pod tetap melayani; koneksi WS di pod yang diganti reconnect ke pod lain.
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      # Harus > preStop (10s) + spring.lifecycle.timeout-per-shutdown-phase (default 30s)
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001 # UID numerik eksplisit (kubelet tidak bisa memverifikasi user bernama "app")
        runAsGroup: 10001
        seccompProfile:
          type:
            RuntimeDefault
            # Production (banyak node): sebar pod backend ke node berbeda → satu node mati tidak mematikan semua backend.
      # ScheduleAnyway = preferensi, bukan syarat → tetap jalan di Docker Desktop yang hanya punya 1 node.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend
      containers:
        - name: backend
          image: llama-express/backend # nama generik; tag ditentukan overlay (images:)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: management # actuator: /actuator/prometheus (di-scrape Prometheus)
              containerPort: 8081
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets # JWT_SECRET, ADMIN_*, CLOUDINARY_URL, MIDTRANS_*_KEY
          env:
            # Kredensial DB diambil dari Secret ORACLE → satu sumber kebenaran, tidak bisa "tidak sinkron"
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: APP_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: oracle-credentials
                  key: APP_USER_PASSWORD
          resources:
            requests:
              cpu: 500m
              memory: 768Mi
            limits:
              memory: 1Gi
          # Start pertama menjalankan Flyway (semua migrasi) di Oracle kosong → beri hingga 3 menit
          # Probe di port UTAMA (/livez, /readyz = add-additional-paths) → yang diperiksa server yang melayani trafik.
          # Start pertama menjalankan Flyway (semua migrasi) di Oracle kosong → beri hingga 3 menit
          startupProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 5
            failureThreshold: 36
          # Readiness = db + redis (grup readiness di application.yml)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Liveness TANPA cek DB: DB down ≠ backend perlu di-restart
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            # Saat pod dihentikan, Kubernetes SECARA PARALEL mengirim SIGTERM dan menghapus pod dari Service.
            # Jeda 10 detik memberi waktu semua node berhenti mengirim request baru ke pod ini,
            # baru kemudian Spring mulai graceful shutdown (menyelesaikan request yang sedang berjalan).
            preStop:
              exec:
                command: ["sleep", "10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp # Tomcat & upload multipart (foto bukti) butuh direktori sementara yang bisa ditulis
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
