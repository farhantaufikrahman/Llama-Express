apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - service.yaml
  - deployment.yaml
  - pdb.yaml

# Konfigurasi NON-rahasia. Nama env var mengikuti relaxed binding Spring:
# SPRING_DATASOURCE_URL → spring.datasource.url, dst. (env var mengalahkan application.yml)
configMapGenerator:
  - name: backend-config
    literals:
      - SPRING_PROFILES_ACTIVE=prod
      - SPRING_DATASOURCE_URL=jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      - SPRING_DATA_REDIS_HOST=redis
      - SPRING_DATA_REDIS_PORT=6379
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - MIDTRANS_NOTIFICATION_URL=https://llama-api.vzkyrielight.my.id/api/v1/payments/midtrans/notification
      # app.cors.allowed-origins (dipakai CORS REST + origin WebSocket STOMP).
      # Env MENGGANTI seluruh list di application.yml (bukan menambah) → localhost:5173 ditulis ulang untuk dev.
      - APP_CORS_ALLOWEDORIGINS=https://llama.vzkyrielight.my.id,http://localhost:5173
      - MANAGEMENT_SERVER_PORT=8081
      - JAVA_TOOL_OPTIONS=-XX:+UseG1GC -XX:MaxRAMPercentage=70 -XX:ActiveProcessorCount=2 -XX:+ExitOnOutOfMemoryError
