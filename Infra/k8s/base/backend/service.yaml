# ClusterIP biasa (bukan headless): satu IP virtual yang membagi beban ke pod-pod backend yang READY.
# Nama "backend" → frontend Nginx (K4) memakai BACKEND_URL=http://backend:8080, sama seperti di Compose.
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8080
      targetPort: http
    - name: management # hanya untuk Prometheus (ServiceMonitor) — HTTPRoute tetap ke port 8080
      port: 8081
      targetPort: management
