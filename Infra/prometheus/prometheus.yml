global:
  scrape_interval: 5s          # dev: cepat supaya grafik langsung bergerak; produksi biasanya 15–30s

scrape_configs:
  - job_name: llama-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["host.docker.internal:8080"]   # backend jalan di Windows, bukan di dalam Docker