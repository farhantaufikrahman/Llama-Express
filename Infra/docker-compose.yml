name: llama-express
services:
  # ───────────────────────────── CI ─────────────────────────────
  jenkins:
    build: ./jenkins
    image: llama-jenkins:local
    container_name: llama-jenkins
    profiles: ["ci"]
    ports:
      - "8090:8080"
    group_add:
      - "0"
    environment:
      JAVA_OPTS: "-Xmx1g"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  # ───────────────────────────── APP ─────────────────────────────
  backend:
    build:
      context: ../Backend/backend
    image: llama-express-backend:local
    profiles: ["app"]
    ports:
      - "8080:8080"
    env_file:
      - ../Backend/backend/.env
    environment:
      SPRING_DATASOURCE_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:19092
      SPRING_DATA_REDIS_HOST: redis
    depends_on:
      oracle:
        condition: service_healthy
      kafka:
        condition: service_started
      redis:
        condition: service_started
    restart: on-failure
    stop_grace_period: 30s

  frontend:
    build:
      context: ../Frontend/frontend
      args:
        VITE_MIDTRANS_CLIENT_KEY: ${MIDTRANS_CLIENT_KEY:?isi MIDTRANS_CLIENT_KEY di Infra/.env}
    image: llama-express-frontend:local
    profiles: ["app"]
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "8088:8080"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped

  # ───────────────────────────── QUALITY ─────────────────────────────
  sonarqube:
    image: sonarqube:26.10.0.133078-community
    profiles: ["quality"]
    ports:
      - "9000:9000"
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_logs:/opt/sonarqube/logs
      - sonarqube_extensions:/opt/sonarqube/extensions
    stop_grace_period: 1m

  # ───────────────────────────── DEV (infrastruktur lokal) ─────────────────────────────
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: llama-oracle
    profiles: ["dev"]
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_PASSWORD}
      APP_USER: ${DB_USERNAME}
      APP_USER_PASSWORD: ${DB_PASSWORD}
    ports:
      - "1521:1521"
    volumes:
      - oracle-data:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  kafka:
    image: apache/kafka:4.1.0
    container_name: llama-kafka
    profiles: ["dev"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: llama-kafka-ui
    profiles: ["dev"]
    depends_on:
      - kafka
    ports:
      - "8091:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092

  redis:
    image: redis:7-alpine
    container_name: llama-redis
    profiles: ["dev"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  # ───────────────────────────── MONITORING ─────────────────────────────
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["monitoring"]
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus

volumes:
  oracle-data:
  kafka-data:
  redis-data:
  sonarqube_data:
  sonarqube_logs:
  sonarqube_extensions:
  jenkins_home:
